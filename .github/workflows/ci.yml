name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CRM_WEBHOOK_SECRET: synthetic-ci-only
      ANTHROPIC_API_KEY: ''
      INDEX_PATH: data/index/ci.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: python -m pip install -r services/ingest/requirements.txt
      - run: python -m pytest -q -W error
        working-directory: services/ingest
      - run: npm ci
        working-directory: apps/api
      - run: npm test
        working-directory: apps/api
      - run: npm run build
        working-directory: apps/api
      - name: Run extractive smoke and evaluation
        shell: bash
        run: |
          (cd services/ingest && python -m uvicorn main:app --host 127.0.0.1 --port 8001) > /tmp/ingest.log 2>&1 &
          INGEST_PID=$!
          (cd apps/api && exec node dist/main.js) > /tmp/api.log 2>&1 &
          API_PID=$!
          trap 'kill "$INGEST_PID" "$API_PID" 2>/dev/null || true' EXIT
          for port in 8001 3000; do
            ready=false
            for attempt in {1..60}; do
              if curl -fsS "http://127.0.0.1:$port/health"; then ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then cat /tmp/ingest.log /tmp/api.log; exit 1; fi
          done
          python scripts/smoke.py
          python eval/run-eval.py --min-hit-rate 0.85 --min-not-found 1.0
